<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DSA Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.5 7.5H7a4.5 4.5 0 0 0 0 9h2.5M14.5 7.5H17a4.5 4.5 0 0 1 0 9h-2.5M8 12h8"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>DSA Bridge</h1>
        <p>LeetCode &amp; GeeksforGeeks links for takeUforward</p>
      </div>
    </div>
  </header>

  <div class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10Zm4-1 3.5 3.5"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="Search 1,369 problems…" autocomplete="off" spellcheck="false" autofocus>
  </div>

  <main id="results" class="results" aria-live="polite"></main>

  <footer class="foot">
    <label class="toggle">
      <input type="checkbox" id="showLeetcode" checked>
      <span>LeetCode badges</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="showGfg" checked>
      <span>GfG badges</span>
    </label>
  </footer>

  <script src="../scripts/resolver.js"></script>
  <script src="popup.js"></script>
</body>
</html>
