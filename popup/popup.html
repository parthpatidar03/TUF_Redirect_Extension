<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TUF Redirect</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.5 13.8V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V8A1.5 1.5 0 0 1 5 6.5h5.2M14 3.5h6.5V10M20.5 3.5 11 13"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>TUF Redirect</h1>
        <p>LeetCode &amp; GeeksforGeeks links for takeUforward</p>
      </div>
    </div>
  </header>

  <div class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10Zm4-1 3.5 3.5"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="Search 1,369 problems…" autocomplete="off" spellcheck="false" autofocus>
  </div>

  <main id="results" class="results" aria-live="polite"></main>

  <footer class="foot">
    <label class="toggle">
      <input type="checkbox" id="showLeetcode" checked>
      <span>LeetCode badges</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="showGfg" checked>
      <span>GfG badges</span>
    </label>
  </footer>

  <script src="../scripts/resolver.js"></script>
  <script src="popup.js"></script>
</body>
</html>
