<!doctype html>
<!--
  Offline stand-in for takeUforward's practice table, used to exercise the
  content script without loading the extension into Chrome.

  The structure mirrors the live page: rows are flex containers, every cell
  carries data-label, and the column widths follow theirs. That matters, because
  an earlier version of this fixture used a plain block layout and hid a bug
  where the injected element collapsed the problem title.

    node tools/dev-server.mjs  ->  http://localhost:8787/tools/fixture.html
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>TUF Redirect fixture</title>
<style>
  :root {
    --color-background: #070709; --color-foreground: #fcfcfd; --color-card: #13161b;
    --color-card-3: #181b21; --color-border: #24272e; --color-text-secondary: #c1c4cc;
    --color-brand-primary: #327cf6; --color-brand-primary-bg-2: #111827; --radius-sm: 4px;
  }
  body { margin: 0; padding: 28px; background: var(--color-background); color: var(--color-foreground);
         font-family: Geist, system-ui, sans-serif; font-size: 14px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  table { width: 100%; max-width: 1040px; border-collapse: collapse; }
  thead tr, tbody tr { display: flex; align-items: center; border-bottom: 1px solid var(--color-border); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #0f1115; }
  th, td { padding: 8px; align-self: stretch; display: flex; align-items: center; }
  th { height: 40px; font-size: 12px; font-weight: 500; }

  /* Column widths, matching the live table. */
  [data-label="Problem"], th.col-problem { flex: 1 1 0; min-width: 12rem; }
  [data-label="Difficulty"], th.col-difficulty { flex: 0 0 6rem; width: 6rem; justify-content: center; text-align: center; }
  [data-label="Companies"], th.col-companies { flex: 0 0 10rem; width: 10rem; justify-content: center; text-align: center; }
  [data-label="Topics"], th.col-topics { flex: 0 0 11rem; width: 11rem; justify-content: center; text-align: center; }
  [data-label="Resources"], th.col-resources { flex: 0 0 5.5rem; width: 5.5rem; justify-content: center; text-align: center; }

  .PracticeProblemTable-module__78o5uG__problemCell { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .PracticeProblemTable-module__78o5uG__problemMain { display: flex; flex-direction: row; align-items: center; min-width: 0; }
  .PracticeProblemTable-module__78o5uG__problemTitle { font-size: 12px; font-weight: 600; }
  .PracticeProblemTable-module__78o5uG__difficultyTag { font-size: 10px; border: 1px solid var(--color-border);
        background: #2a2318; color: #e0a33a; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.2px solid #3a3f49; flex: 0 0 auto; }
  .res { color: #5d636e; font-size: 11px; }
</style>
</head>
<body>
<h2>Practice table fixture</h2>
<table>
  <thead>
    <tr data-slot="table-row">
      <th data-slot="table-head" class="col-problem">Problem</th>
      <th data-slot="table-head" class="col-difficulty">Difficulty</th>
      <th data-slot="table-head" class="col-companies">Companies</th>
      <th data-slot="table-head" class="col-topics">Topics</th>
      <th data-slot="table-head" class="col-resources">Resources</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
  // Rows built from real takeUforward titles, including the two awkward shapes:
  // a difficulty chip nested inside the title span, and a POTD chip.
  var ROWS = [
    ['1. Two Sum', 'Basic', 'Hashing', null],
    ['3. Reverse a LL', 'Core', 'Linked List', null],
    ['17. Grid unique paths', 'Core', 'Dynamic Pr...', 'Core'],
    ['893. Express Number as Sum of Two Primes', 'Core', 'Mathematics', 'POTD'],
    ['18. Maximum Depth in BT', 'Basic', 'Binary Trees', null],
    ['560. Maximum Linear Stock Score', 'Core', 'Arrays', null]
  ];

  var tbody = document.getElementById('rows');
  window.rowClicks = 0;

  ROWS.forEach(function (row) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-slot', 'table-row');
    tr.setAttribute('role', 'link');
    tr.tabIndex = 0;
    tr.addEventListener('click', function () { window.rowClicks++; });

    var title = '<span class="PracticeProblemTable-module__78o5uG__problemTitle">' + row[0] +
      (row[3] ? '<span class="PracticeProblemTable-module__78o5uG__difficultyTag">' + row[3] + '</span>' : '') +
      '</span>';

    tr.innerHTML =
      '<td data-slot="table-cell" data-label="Problem">' +
        '<div class="PracticeProblemTable-module__78o5uG__problemCell"><span class="dot"></span>' +
          '<div class="PracticeProblemTable-module__78o5uG__problemMain">' + title + '</div>' +
        '</div></td>' +
      '<td data-slot="table-cell" data-label="Difficulty"><span class="PracticeProblemTable-module__78o5uG__difficultyTag">' + row[1] + '</span></td>' +
      '<td data-slot="table-cell" data-label="Companies"><span class="res">locked</span></td>' +
      '<td data-slot="table-cell" data-label="Topics"><span class="res">' + row[2] + '</span></td>' +
      '<td data-slot="table-cell" data-label="Resources"><span class="res">article</span></td>';
    tbody.appendChild(tr);
  });

  // Stand-in for the extension APIs. storage.sync.get supports both the promise
  // form the content script uses and the callback form the popup uses.
  var store = { enabled: true, showLeetcode: true, showGfg: true };
  window.chrome = {
    runtime: { getURL: function (p) { return '/' + p; } },
    storage: {
      sync: {
        get: function (keys, cb) {
          if (typeof cb === 'function') { cb(store); return; }
          return Promise.resolve(store);
        },
        set: function (patch) { Object.assign(store, patch); }
      },
      // Real listeners, so the popup's on/off switch can be exercised here:
      //   fireChange({ enabled: false })
      onChanged: {
        listeners: [],
        addListener: function (fn) { this.listeners.push(fn); }
      }
    }
  };
  window.fireChange = function (patch) {
    Object.assign(store, patch);
    var changes = {};
    Object.keys(patch).forEach(function (k) { changes[k] = { newValue: patch[k] }; });
    window.chrome.storage.onChanged.listeners.forEach(function (fn) { fn(changes); });
  };
</script>
<link rel="stylesheet" href="/styles/content.css">
<script src="/scripts/resolver.js"></script>
<script src="/scripts/content.js"></script>
</body>
</html>
